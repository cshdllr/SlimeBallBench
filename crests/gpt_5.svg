    <polygon points="38,36 40,39 44,39 41,41 42,45 38,43 35,45 36,41 33,39 37,39"/>
    <polygon points="62,36 64,39 68,39 65,41 66,45 62,43 59,45 60,41 57,39 61,39"/>
