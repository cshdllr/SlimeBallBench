<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Shield background -->
  <path d="M 50 10 L 75 25 L 75 50 Q 75 75 50 85 Q 25 75 25 50 L 25 25 Z" fill="#D97757" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- Inner shield highlight -->
  <path d="M 50 15 L 72 28 L 72 50 Q 72 72 50 81 Q 28 72 28 50 L 28 28 Z" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
  
  <!-- Soccer ball in upper center -->
  <circle cx="50" cy="35" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="0.8"/>
  <circle cx="50" cy="35" r="11.5" fill="none" stroke="#D97757" stroke-width="1.2"/>
  
  <!-- Ball pentagon pattern -->
  <polygon points="50,25 55,30 53,38 47,38 45,30" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
  <polygon points="50,45 55,40 57,48 50,52 43,48" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
  
  <!-- Soccer goal posts (lower half) -->
  <line x1="38" y1="50" x2="38" y2="68" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="62" y1="50" x2="62" y2="68" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="38" y1="50" x2="62" y2="50" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Goal net pattern -->
  <line x1="40" y1="54" x2="60" y2="54" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
  <line x1="39" y1="59" x2="61" y2="59" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
  <line x1="38" y1="64" x2="62" y2="64" stroke="#ffffff" stroke-width="0.6" opacity="0.6"/>
  <line x1="40" y1="52" x2="38" y2="68" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  <line x1="60" y1="52" x2="62" y2="68" stroke="#ffffff" stroke-width="0.5" opacity="0.5"/>
  
  <!-- Accent star shapes on sides -->
  <polygon points="32,42 34,48 40,48 35,52 37,58 32,54 27,58 29,52 24,48 30,48" fill="#ffffff" opacity="0.7"/>
  <polygon points="68,42 70,48 76,48 71,52 73,58 68,54 63,58 65,52 60,48 66,48" fill="#ffffff" opacity="0.7"/>
  
  <!-- Bottom accent banner curve -->
  <path d="M 30 75 Q 50 82 70 75" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
</svg>