<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlimeBallBench — Statistics</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <a href="./" class="title">SlimeBallBench</a>
    <nav>
      <a href="./">Videos</a>
      <a href="standings">Standings</a>
      <a href="stats" class="active">Statistics</a>
      <a href="howitworks">How it works</a>
    </nav>
  </header>

  <div id="provenance"></div>

  <h2 class="section-h first">At a glance</h2>
  <div id="compare"></div>

  <h2 class="section-h">By metric</h2>
  <div id="charts"></div>

  <h2 class="section-h">Full table</h2>
  <div id="content"></div>

  <footer class="site">
    Made by <a href="https://jasoncashdollar.com">Jason Cashdollar</a>
  </footer>
</div>

<script src="logos.js"></script>
<script src="favicon.js"></script>
<script>
// column definitions: [key, label, formatter]
const COLS = [
  ["name", "Team", null],
  ["games", "GP", v => v],
  ["goals_for", "GF", v => v],
  ["goals_against", "GA", v => v],
  ["goal_diff", "GD", v => (v >= 0 ? "+" + v : v)],
  ["ball_touches", "Touches", v => v],
  ["goals_per_touch", "G/Touch", v => v],
  ["saves", "Saves", v => v],
  ["own_goals", "OG", v => v],
  ["jumps", "Jumps", v => v],
  ["avg_possession_pct", "Poss%", v => v],
  ["avg_latency_ms", "Latency", v => v == null ? "—" : v + "ms"],
  ["total_cost_usd", "Cost", v => "$" + (v ?? 0).toFixed(4)],
];

let ROWS = [];
let sortKey = "goal_diff", sortDir = -1;

// Small multiples: each entry is one ranked bar-chart. `better` decides ordering
// (best on top). `baseline` decides bar length: "zero" draws width from a true
// zero baseline (honest for counts), "range" uses inverted min-max so a short bar
// reads as good (kept only for latency/cost, where zero baseline flattens things).
// `neutral` suppresses the "best" highlight for metrics that aren't a virtue.
const SMALL_MULTIPLES = [
  { key: "goals_for",          label: "Goals for",       better: "high", baseline: "zero",  fmt: v => v },
  { key: "goals_against",      label: "Goals against",   better: "low",  baseline: "zero",  fmt: v => v },
  { key: "goals_per_touch",    label: "Goals per touch", better: "high", baseline: "zero",  fmt: v => v.toFixed(3) },
  { key: "avg_possession_pct", label: "Possession",      better: "high", baseline: "zero",  fmt: v => v + "%" },
  { key: "saves",              label: "Saves",           better: "high", baseline: "zero",  fmt: v => v },
  { key: "own_goals",          label: "Own goals",       better: "low",  baseline: "zero",  fmt: v => v },
  { key: "jumps",              label: "Jumps",           better: "high", baseline: "zero",  neutral: true, fmt: v => v },
  { key: "cost_per_point",     label: "Cost per point",  better: "low",  baseline: "range", fmt: v => "$" + v.toFixed(3) + "/pt" },
  { key: "avg_latency_ms",     label: "Avg latency",     better: "low",  baseline: "range", fmt: v => v == null ? "—" : v + "ms" },
  { key: "total_cost_usd",     label: "Total cost",      better: "low",  baseline: "range", fmt: v => "$" + (v ?? 0).toFixed(2) },
];

function renderSmallMultiples() {
  const charts = SMALL_MULTIPLES.map(m => {
    const vals = ROWS.map(r => r[m.key]).filter(v => v != null);
    if (!vals.length) return "";
    const max = Math.max(...vals), min = Math.min(...vals);
    // best on top: descending for high-is-better, ascending for low-is-better
    const ranked = [...ROWS]
      .filter(r => r[m.key] != null)
      .sort((a, b) => m.better === "low" ? a[m.key] - b[m.key] : b[m.key] - a[m.key]);
    const rows = ranked.map((r, i) => {
      const v = r[m.key];
      let w;
      if (m.baseline === "zero") {
        w = max ? v / max * 100 : 0; // honest zero baseline
      } else {
        // inverted min-max: shortest value still draws the longest (best) bar
        const span = (max - min) || 1;
        const frac = m.better === "low" ? (max - v) / span : (v - min) / span;
        w = 6 + frac * 94; // keep a sliver visible even for the worst
      }
      const best = i === 0 && !m.neutral;
      return `<div class="smrow${best ? " best" : ""}">
          <span class="lab" title="${r.name}">${r.name}</span>
          <span class="track"><span class="b" style="width:${w}%;background:${r.color}"></span></span>
          <span class="num">${m.fmt(v)}</span>
        </div>`;
    }).join("");
    return `<div class="sm"><h3>${m.label}${m.hint ? `<span class="hint">${m.hint}</span>` : ""}</h3>${rows}</div>`;
  }).join("");
  document.getElementById("charts").innerHTML = `<div class="smgrid">${charts}</div>`;
}

// "At a glance" comparison grid: models are columns (rank order), metrics are
// rows. `better` decides which cell wins the row (and gets the outline).
const COMPARE = [
  { key: "wins",               label: "Wins",            better: "high", fmt: v => v },
  { key: "points",             label: "Points",          better: "high", fmt: v => v },
  { key: "goals_for",          label: "Goals for",       better: "high", fmt: v => v },
  { key: "goals_against",      label: "Goals against",   better: "low",  fmt: v => v },
  { key: "goal_diff",          label: "Goal diff",       better: "high", fmt: v => (v >= 0 ? "+" + v : v) },
  { key: "saves",              label: "Saves",           better: "high", fmt: v => v },
  { key: "own_goals",          label: "Own goals",       better: "low",  fmt: v => v },
  { key: "goals_per_touch",    label: "Goals per touch", better: "high", fmt: v => v.toFixed(3) },
  { key: "avg_possession_pct", label: "Possession",      better: "high", fmt: v => v + "%" },
  { key: "jumps",              label: "Jumps",           better: "high", fmt: v => v },
];

// Break a model name onto two stacked lines: the first word on top, the rest
// below (e.g. "Claude" / "Opus 4.8"), so column headers read without rotation.
function twoLineName(name) {
  const i = name.indexOf(" ");
  const top = i === -1 ? name : name.slice(0, i);
  const rest = i === -1 ? "" : name.slice(i + 1);
  return `<span class="cl1">${top}</span>${rest ? `<span class="cl2">${rest}</span>` : ""}`;
}

function renderCompare(models) {
  const head = models.map(m =>
    `<th><a href="model?id=${m.id}">${crestMark(m.id, 26, m.color)}<span class="cname">${twoLineName(m.name)}</span></a></th>`
  ).join("");
  const body = COMPARE.map(metric => {
    const vals = models.map(m => m[metric.key]).filter(v => v != null);
    const best = vals.length
      ? (metric.better === "low" ? Math.min(...vals) : Math.max(...vals))
      : null;
    const cells = models.map(m => {
      const v = m[metric.key];
      if (v == null) return `<td>—</td>`;
      const win = best != null && v === best ? " win" : "";
      return `<td class="${win.trim()}">${metric.fmt(v)}</td>`;
    }).join("");
    return `<tr>
      <td class="metric">${metric.label}${metric.hint ? `<span class="mhint">${metric.hint}</span>` : ""}</td>
      ${cells}
    </tr>`;
  }).join("");
  document.getElementById("compare").innerHTML =
    `<div class="table-scroll compare-scroll">
       <table class="compare-table">
         <thead><tr><th class="metric"></th>${head}</tr></thead>
         <tbody>${body}</tbody>
       </table>
     </div>`;
}

function render() {
  ROWS.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (sortKey === "name") return sortDir * String(x).localeCompare(String(y));
    x = x ?? -Infinity; y = y ?? -Infinity;
    return sortDir * (x - y);
  });
  const head = COLS.map(([k, label]) =>
    `<th class="sortable" data-key="${k}">${label}${sortKey === k ? (sortDir < 0 ? " ▾" : " ▴") : ""}</th>`
  ).join("");
  const body = ROWS.map(r => `<tr class="clickable" onclick="location.href='model?id=${r.id}'">` +
    COLS.map(([k, , fmt]) => {
      if (k === "name") return `<td class="team-cell">
          ${crestMark(r.id, 22, r.color)}
          <a href="model?id=${r.id}">${r.name}</a>${providerLogo(r.provider)}</td>`;
      return `<td>${fmt ? fmt(r[k]) : r[k]}</td>`;
    }).join("") + "</tr>").join("");

  document.getElementById("content").innerHTML =
    `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;

  document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
    const k = th.dataset.key;
    if (k === sortKey) sortDir = -sortDir;
    else { sortKey = k; sortDir = k === "name" ? 1 : -1; }
    render();
  }));
}

async function load() {
  let season;
  try {
    season = await (await fetch("season.json")).json();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Couldn't load <code>season.json</code>. Serve over HTTP and try again.</div>`;
    return;
  }
  const byId = Object.fromEntries(season.models.map(m => [m.id, m]));
  const standById = Object.fromEntries(season.standings.map(r => [r.id, r]));
  ROWS = Object.entries(season.aggregate_stats).map(([id, s]) => {
    const st = standById[id] || {};
    const points = st.points ?? 0;
    // efficiency: $ spent per league point. 0 points → no meaningful ratio.
    const cost_per_point = points > 0 ? (s.total_cost_usd ?? 0) / points : null;
    return {
      id, name: byId[id].name, color: byId[id].color, abbrev: byId[id].abbrev,
      provider: byId[id].provider, points, wins: st.w ?? 0, cost_per_point, ...s,
    };
  });
  document.getElementById("provenance").innerHTML = provenanceStrip(season);
  // comparison grid: columns follow the standings' rank order (leader first)
  const byIdRow = Object.fromEntries(ROWS.map(r => [r.id, r]));
  renderCompare(season.standings.map(st => byIdRow[st.id]).filter(Boolean));
  renderSmallMultiples();
  render();
}

// Quiet "provenance" strip: version, season, coverage, freshness date.
function provenanceStrip(season) {
  const total = season.matches.length;
  const played = season.matches.filter(m => m.played_at).length;
  const date = new Date(season.generated_at).toLocaleDateString("en-US",
    { month: "short", day: "numeric", year: "numeric" });
  return `<p class="provenance">SlimeBallBench v1.0 · Season 1 ·
    ${played}/${total} matches · Updated ${date}</p>`;
}
load();
</script>
</body>
</html>
