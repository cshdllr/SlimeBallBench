<script src="logos.js"></script>

<script>
// Quiet "provenance" line for the footer: version, season, coverage, freshness.
function provenanceText(season) {
  const total = season.matches.length;
  const played = season.matches.filter(m => m.played_at).length;
  // non-breaking spaces keep each segment (and its trailing "·") intact, so the
  // line only wraps between segments — e.g. "Updated Jul 2, 2026" never splits
  const segs = ["SlimeBallBench v1.0", "Season 1", `${played}/${total} matches`];
  return segs.map(s => s.replace(/ /g, "\u00A0")).join("\u00A0\u00B7 ");
}

async function load() {
  let season;
  try {
    season = await (await fetch("season.json")).json();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Couldn't load <code>season.json</code>.
       ${location.protocol === "file:"
         ? "This page is open as a <code>file://</code>, so browsers block loading data that way. "
         : ""}
       Serve this folder over HTTP and open it through the server:<br><br>
       <code>python3 serve.py</code><br>
       then visit <code>http://localhost:8000/standings</code>.</div>`;
    return;
  }

  // Scales for the inline bars: points relative to the leader, GD relative to
  // the largest swing in either direction (so the diverging bars share one scale).
  const maxPts = Math.max(1, ...season.standings.map(r => r.points));
  const maxGd = Math.max(1, ...season.standings.map(r => Math.abs(r.gd)));

  const gdBar = gd => {
    const w = Math.abs(gd) / maxGd * 50; // up to half the track each side
    const side = gd > 0 ? "pos" : gd < 0 ? "neg" : "";
    const label = (gd >= 0 ? "+" + gd : gd);
    return `<div class="divwrap">
        <div class="dtrack"><div class="axis"></div>
          ${gd ? `<div class="dbar ${side}" style="width:${w}%"></div>` : ""}</div>
        <span class="dval ${side}">${label}</span></div>`;
  };

  // ---- Head-to-head matrix: rows/cols = teams in rank order, each cell shows
  // the pairing from the ROW team's perspective (row goals first). Single
  // round-robin, so one match per pair mirrored into both off-diagonal cells. ----
  const order = season.standings; // already rank-ordered
  const matchBetween = {};
  for (const m of season.matches) {
    if (!m.played_at) continue;
    matchBetween[m.home + "|" + m.away] = m;
    matchBetween[m.away + "|" + m.home] = m;
  }
  const h2hCell = (rowId, colId) => {
    if (rowId === colId) return `<td class="h2h-diag"></td>`;
    const m = matchBetween[rowId + "|" + colId];
    if (!m) return `<td class="h2h-empty">—</td>`;
    const rowIsHome = m.home === rowId;
    const myG = rowIsHome ? m.score[0] : m.score[1];
    const opG = rowIsHome ? m.score[1] : m.score[0];
    const res = myG > opG ? "W" : myG < opG ? "L" : "D";
    return `<td class="h2h ${res}"><a href="replay?log=${encodeURIComponent(m.log)}">${myG}–${opG}</a></td>`;
  };
  const h2hHead = order.map(c =>
    `<th class="h2h-col" title="${c.name}">${crestMark(c.id, 26, c.color)}</th>`
  ).join("");
  const h2hRows = order.map(r => `
    <tr>
      <th class="h2h-nc">${r.name}</th>
      <td class="h2h-cc">${crestMark(r.id, 26, r.color)}</td>
      ${order.map(c => h2hCell(r.id, c.id)).join("")}
    </tr>`).join("");
  const h2h = `
    <h2 class="section-h">Head-to-head</h2>
    <div class="h2h-frame">
      <div class="h2h-scroll">
        <table class="h2h-table">
          <thead><tr><th class="h2h-nc"></th><th class="h2h-cc"></th>${h2hHead}</tr></thead>
          <tbody>${h2hRows}</tbody>
        </table>
      </div>
    </div>`;

  const rows = season.standings.map(r => `
    <tr class="clickable${r.rank === 1 ? ' leader' : ''}" onclick="location.href='model?id=${r.id}'">
      <td class="pos">${r.rank}</td>
      <td class="logo-cell">${crestMark(r.id, 40, r.color)}</td>
      <td class="team-cell team-stack">
        <span class="tstack">
          <span class="name">${r.name}</span>
          <span class="meta">${providerLogo(r.provider)}${r.provider}</span>
        </span>
      </td>
      <td>${r.played}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td>
      <td>${r.gf}</td><td>${r.ga}</td>
      <td class="barcell">${gdBar(r.gd)}</td>
      <td class="barcell"><div class="barwrap">
        <div class="bar" style="width:${r.points / maxPts * 100}%;background:${r.color}"></div>
        <span class="val">${r.points}</span></div></td>
    </tr>`).join("");

  document.getElementById("footProv").textContent = provenanceText(season);
  document.getElementById("content").innerHTML = `
    <div class="table-scroll standings-scroll first-block">
    <table>
      <thead><tr>
        <th>#</th><th></th><th class="lft">Team</th><th>P</th><th>W</th><th>D</th><th>L</th>
        <th>GF</th><th>GA</th><th class="lft">GD</th><th class="barcell lft">Pts</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
    </div>
    ${h2h}`;
}
load();
</script>
