<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlimeBallBench · Team</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="site">
    <a href="./" class="title">SlimeBallBench</a>
    <nav>
      <a href="./">Videos</a>
      <a href="standings">Standings</a>
      <a href="stats">Statistics</a>
      <a href="howitworks">How it works</a>
    </nav>
  </header>
  <div id="content"></div>

  <footer class="site">
    <span class="prov-foot" id="footProv"></span>
    <span>Made by <a href="https://jasoncashdollar.com">Jason Cashdollar</a></span>
  </footer>
</div>

<script src="logos.js"></script>
<script src="favicon.js"></script>
<script>
function qs(name) { return new URLSearchParams(location.search).get(name); }

function provenanceText(season) {
  const total = season.matches.length;
  const played = season.matches.filter(m => m.played_at).length;
  const date = new Date(season.generated_at).toLocaleDateString("en-US",
    { month: "short", day: "numeric", year: "numeric" });
  return `SlimeBallBench v1.0 · Season 1 · ${played}/${total} matches · Updated ${date}`;
}

async function load() {
  const id = qs("id");
  let season;
  try {
    season = await (await fetch("season.json")).json();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Couldn't load <code>season.json</code>. Serve over HTTP and try again.</div>`;
    return;
  }
  document.getElementById("footProv").textContent = provenanceText(season);

  const team = season.standings.find(r => r.id === id);
  const model = season.models.find(m => m.id === id);
  const agg = (season.aggregate_stats || {})[id];
  if (!team || !model) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Unknown team. <a href="standings">Back to standings</a>.</div>`;
    return;
  }

  // current rank of every team, for the opponent column
  const rankById = Object.fromEntries(season.standings.map(r => [r.id, r.rank]));

  // fixtures involving this team, from its own perspective
  const games = season.matches
    .filter(m => m.home === id || m.away === id)
    .map(m => {
      const isHome = m.home === id;
      const oppId = isHome ? m.away : m.home;
      const oppName = isHome ? m.away_name : m.home_name;
      const myG = isHome ? m.score[0] : m.score[1];
      const opG = isHome ? m.score[1] : m.score[0];
      const res = myG > opG ? "W" : myG < opG ? "L" : "D";
      return { isHome, oppId, oppName, myG, opG, res, log: m.log, played_at: m.played_at };
    });

  const card = (k, v) => `<div class="card"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  const aggCards = agg ? `
    <div class="cards">
      ${card("Goals for", agg.goals_for)}
      ${card("Goals against", agg.goals_against)}
      ${card("Goal diff", (agg.goal_diff >= 0 ? "+" : "") + agg.goal_diff)}
      ${card("Ball touches", agg.ball_touches)}
      ${card("Goals / touch", agg.goals_per_touch)}
      ${card("Saves", agg.saves)}
      ${card("Own goals", agg.own_goals)}
      ${card("Jumps", agg.jumps)}
      ${card("Possession", agg.avg_possession_pct + "%")}
      ${card("Avg latency", agg.avg_latency_ms != null ? agg.avg_latency_ms + " ms" : "—")}
      ${card("Total cost", "$" + (agg.total_cost_usd ?? 0).toFixed(2) +
        `<span class="v-sub">$${(agg.games ? (agg.total_cost_usd ?? 0) / agg.games : 0).toFixed(2)}/match</span>`)}
    </div>` : "";

  const fixtureRows = games.map(g => `
    <tr>
      <td class="team-cell">${g.isHome ? "vs" : "@"}
        ${crestMark(g.oppId, 18)}<a href="model?id=${g.oppId}">${g.oppName}</a>
        <span class="meta">#${rankById[g.oppId] ?? "?"}</span></td>
      <td>${g.myG} – ${g.opG}</td>
      <td><span class="result ${g.res}">${g.res}</span></td>
      <td style="text-align:right"><a class="watch-btn" href="replay?log=${encodeURIComponent(g.log)}"><span class="tri">▶</span>Watch</a></td>
    </tr>`).join("");

  document.getElementById("content").innerHTML = `
    <h1>${crestMark(model.id, 30, model.color)}${team.name}${providerLogo(model.provider)}</h1>
    <p class="sub">${providerLogo(model.provider)} ${model.provider} · <code>${model.model}</code> · Rank #${team.rank} ·
       ${team.w}W ${team.d}D ${team.l}L · ${team.points} pts</p>
    ${aggCards}
    <h2 class="section-h">Schedule</h2>
    <div class="table-scroll">
    <table>
      <thead><tr><th>Opponent</th><th>Score</th><th>Result</th><th>Watch</th></tr></thead>
      <tbody>${fixtureRows || '<tr><td colspan="4">No games yet.</td></tr>'}</tbody>
    </table>
    </div>
    <p class="sub" style="margin-top:14px"><a href="standings">← Back to standings</a></p>`;
}
load();
</script>
</body>
</html>
