<body>
<div class="wrap">
  <header class="site">
    <a href="./" class="title">SlimeBallBench</a>
    <nav>

  <footer class="site">
    <span class="prov-foot" id="footProv"></span>
    <span class="foot-by">Made by <a href="https://jasoncashdollar.com" target="_blank" rel="noopener">Jason Cashdollar</a></span>
  </footer>
</div>

<script src="logos.js"></script>
<script src="favicon.js"></script>
<script>
function qs(name) { return new URLSearchParams(location.search).get(name); }

function provenanceText(season) {
  const total = season.matches.length;
  const played = season.matches.filter(m => m.played_at).length;
  // non-breaking spaces keep each segment (and its trailing "·") intact, so the
  // line only wraps between segments — e.g. "Updated Jul 2, 2026" never splits
  const segs = ["SlimeBallBench v1.0", "Season 1", `${played}/${total} matches`];
  return segs.map(s => s.replace(/ /g, "\u00A0")).join("\u00A0\u00B7 ");
}

async function load() {
  const id = qs("id");
  let season;
  try {
    season = await (await fetch("season.json")).json();
  } catch (e) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Couldn't load <code>season.json</code>. Serve over HTTP and try again.</div>`;
    return;
  }
  document.getElementById("footProv").textContent = provenanceText(season);

  const team = season.standings.find(r => r.id === id);
  const model = season.models.find(m => m.id === id);
  const agg = (season.aggregate_stats || {})[id];
  if (!team || !model) {
    document.getElementById("content").innerHTML =
      `<div class="notice">Unknown team. <a href="standings">Back to standings</a>.</div>`;
    return;
  }

  // which team page a visitor opened
  window.sbbTrack && sbbTrack("model_view", { model_name: team.name, model_id: id });

  // current rank of every team, for the opponent column
  const rankById = Object.fromEntries(season.standings.map(r => [r.id, r.rank]));

  // fixtures involving this team, from its own perspective
  const games = season.matches
    .filter(m => m.home === id || m.away === id)
    .map(m => {
      const isHome = m.home === id;
      const oppId = isHome ? m.away : m.home;
      const oppName = isHome ? m.away_name : m.home_name;
      const myG = isHome ? m.score[0] : m.score[1];
      const opG = isHome ? m.score[1] : m.score[0];
      const res = myG > opG ? "W" : myG < opG ? "L" : "D";
      return { isHome, oppId, oppName, myG, opG, res, log: m.log, played_at: m.played_at };
    });

  // league average for every metric, so each stat shows its gap vs the field
  const allStats = Object.values(season.aggregate_stats || {});
  const leagueAvg = key => {
    const vals = allStats.map(s => s[key]).filter(v => v != null);
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  // mini-viz: a bar centred on the league average, filling green (above) or red
  // (below), with the signed % difference beneath it
  // invert = true for metrics where higher is worse (e.g. latency): above-average
  // fills red, below-average fills green — the reverse of the default colouring.
  const card = (label, display, key, invert = false) => {
    let viz = "";
    if (key && agg && agg[key] != null) {
      const avg = leagueAvg(key);
      if (avg != null && Math.abs(avg) > 1e-9) {   // skip metrics whose avg is ~0 (goal diff)
        const pct = Math.round((agg[key] - avg) / Math.abs(avg) * 100);
        const w = Math.min(Math.abs(pct), 100) / 100 * 50;
        const good = invert ? pct < 0 : pct >= 0;   // green when good, red when bad
        viz = `<div class="avgbar"><span class="lab">avg</span>
            <div class="track"><div class="axis"></div>
              <div class="fill ${good ? "pos" : "neg"}" style="width:${w}%"></div></div></div>
          <div class="pct ${good ? "pos" : "neg"}">${pct > 0 ? "+" : ""}${pct}%</div>`;
      }
    }
    return `<div class="card"><div class="k">${label}</div><div class="v">${display}</div>${viz}</div>`;
  };
  const aggCards = agg ? `
    <div class="cards">
      ${card("Goals for", agg.goals_for, "goals_for")}
      ${card("Goals against", agg.goals_against, "goals_against")}
      ${card("Goal diff", (agg.goal_diff >= 0 ? "+" : "") + agg.goal_diff)}
      ${card("Ball touches", agg.ball_touches, "ball_touches")}
      ${card("Goals / touch", agg.goals_per_touch, "goals_per_touch")}
      ${card("Saves", agg.saves, "saves")}
      ${card("Own goals", agg.own_goals, "own_goals")}
      ${card("Jumps", agg.jumps, "jumps")}
      ${card("Possession", agg.avg_possession_pct + "%", "avg_possession_pct")}
      ${card("Avg latency", agg.avg_latency_ms != null ? agg.avg_latency_ms + " ms" : "—", "avg_latency_ms", true)}
      ${card("Total cost", "$" + (agg.total_cost_usd ?? 0).toFixed(2), "total_cost_usd")}
    </div>` : "";

  const fixtureRows = games.map(g => `
    <tr class="clickable" onclick="location.href='replay?log=${encodeURIComponent(g.log)}'">
      <td class="team-cell">${g.isHome ? "vs" : "@"}
        ${crestMark(g.oppId, 18)}<span>${g.oppName}</span>
        <span class="meta">#${rankById[g.oppId] ?? "?"}</span></td>
      <td>${g.myG} – ${g.opG}</td>
      <td><span class="result ${g.res}">${g.res}</span></td>
    </tr>`).join("");

  document.getElementById("content").innerHTML = `
    <div class="team-head">
      ${crestMark(model.id, 52, model.color)}
      <div>
        <h1>${team.name}</h1>
        <p class="sub">${providerLogo(model.provider)} ${model.provider} · <code>${model.model}</code> · Rank #${team.rank} ·
           ${team.w}W ${team.d}D ${team.l}L · ${team.points} pts</p>
      </div>
    </div>
    ${aggCards}
    <h2 class="section-h">Schedule</h2>
    <div class="table-scroll">
    <table class="schedule-table">
      <thead><tr><th>Opponent</th><th>Score</th><th>Result</th></tr></thead>
      <tbody>${fixtureRows || '<tr><td colspan="3">No games yet.</td></tr>'}</tbody>
    </table>
    </div>
    <p class="sub" style="margin-top:14px"><a href="standings">← Back to standings</a></p>`;
}
load();
</script>
</body>
