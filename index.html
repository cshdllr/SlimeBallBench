<script>
// Quiet "provenance" line for the footer: version, season, coverage, freshness.
function provenanceText(season) {
  const total = season.matches.length;
  const played = season.matches.filter(m => m.played_at).length;
  // non-breaking spaces keep each segment (and its trailing "·") intact, so the
  // line only wraps between segments — e.g. "Updated Jul 2, 2026" never splits
  const segs = ["SlimeBallBench v1.0", "Season 1", `${played}/${total} matches`];
  return segs.map(s => s.replace(/ /g, "\u00A0")).join("\u00A0\u00B7 ");
}

async function load() {
  let season;
  try {
    season = await (await fetch("season.json")).json();
  } catch (e) {
    document.getElementById("fallback").innerHTML =
      `<div class="notice">Couldn't load <code>season.json</code>.
       ${location.protocol === "file:"
         ? "This page is open as a <code>file://</code>, so browsers block loading data that way. "
         : ""}
       Serve this folder over HTTP:<br><br>
       <code>python3 serve.py</code><br>
       then visit <code>http://localhost:8000/</code>.</div>`;
    return;
  }
  document.getElementById("footProv").textContent = provenanceText(season);
  renderWatcher(season);
}

// ---- "Watch a match": embed the self-contained replay + picker. The team
// dropdowns live in the replay's scoreboard; below the pitch it shows that
// match's goal-differential timeline and full head-to-head stat breakdown. ----
function renderWatcher(season) {
  if (!season.matches.some(m => m.log)) return;  // nothing to show yet
  document.getElementById("watchSection").classList.remove("hidden");
  const wrap = document.getElementById("watch");
  wrap.innerHTML = `<iframe id="stageFrame" class="stage-frame"
      src="replay?embed=1&autoplay=1&picker=1" title="match replay" scrolling="no"></iframe>`;
  const fr = document.getElementById("stageFrame");
  const fit = () => { try { fr.style.height = fr.contentDocument.body.scrollHeight + "px"; } catch (_) {} };
  fr.addEventListener("load", () => { fit(); setTimeout(fit, 400); setTimeout(fit, 1200); });
  window.addEventListener("resize", fit);
  // the embedded replay posts this after it (re)loads a match
  window.addEventListener("message", e => { if (e.data === "sbb-resize") fit(); });
}
load();
</script>
